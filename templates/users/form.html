{% extends "base.html" %}
{% block title %}Add user · IR Maintenance{% endblock %}
{% block eyebrow %}Access{% endblock %}
{% block page_title %}Create a sign-in{% endblock %}
{% block content %}
<a class="back" href="{% url 'user_list' %}">← People</a>
<form method="post" class="ask-form js-once" autocomplete="off">
  {% csrf_token %}
  <section class="ask-step">
    <span class="ask-num">1</span>
    <div class="ask-pair">
      <label class="lbl">First name
        <input name="first_name" required value="{{ form.first_name.value|default_if_none:'' }}">
        {{ form.first_name.errors }}
      </label>
      <label class="lbl">Last name
        <input name="last_name" required value="{{ form.last_name.value|default_if_none:'' }}">
        {{ form.last_name.errors }}
      </label>
    </div>
  </section>
  <section class="ask-step">
    <span class="ask-num">2</span>
    <label class="lbl">Sign-in ID
      <input name="username" required autocomplete="off" value="{{ form.username.value|default_if_none:'' }}">
      {{ form.username.errors }}
    </label>
  </section>
  <section class="ask-step">
    <span class="ask-num">3</span>
    <label class="lbl">Role
      <select name="role">
        {% for value, label in form.fields.role.choices %}
        <option value="{{ value }}" {% if form.role.value|default:"admin" == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
      {{ form.role.errors }}
    </label>
  </section>
  <section class="ask-step">
    <span class="ask-num">4</span>
    <label class="lbl">Department
      <input name="department" list="departments" required value="{{ form.department.value|default_if_none:'' }}">
      <datalist id="departments">
        <option value="Maintenance"></option>
        <option value="Assembly"></option>
        <option value="Testing"></option>
        <option value="Quality"></option>
        <option value="Reliability"></option>
        <option value="Stores"></option>
      </datalist>
      {{ form.department.errors }}
    </label>
  </section>
  <section class="ask-step">
    <span class="ask-num">5</span>
    <div class="ask-pair">
      <label class="lbl">Employee code
        <input name="employee_code" placeholder="Optional" value="{{ form.employee_code.value|default_if_none:'' }}">
        {{ form.employee_code.errors }}
      </label>
      <label class="lbl">Phone
        <input name="phone" value="{{ form.phone.value|default_if_none:'' }}">
      </label>
    </div>
  </section>
  <section class="ask-step">
    <span class="ask-num">6</span>
    <div class="ask-pair">
      <label class="lbl">Password
        <input type="password" name="password" required minlength="8" autocomplete="new-password">
        {{ form.password.errors }}
      </label>
      <label class="lbl">Confirm password
        <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
        {{ form.confirm_password.errors }}
      </label>
    </div>
  </section>
  <button class="btn btn-primary ask-send" type="submit">Create user</button>
</form>
{% endblock %}
